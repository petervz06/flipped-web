<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo preview — real iPhone footage (NOT LINKED)</title>
  <link rel="stylesheet" href="styles.css?v=21" />
  <style>
    /* Preview-only page for Pete's eyeball — not linked from anywhere.
       Variant A (picture-in-picture) + REAL iPhone footage in the bezel. */
    .demo-stage-v2 {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 0 40px;
    }
    .real-iphone {
      width: 270px;
      border-radius: 38px;
      border: 10px solid #1c1c1e;
      background: #000;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.65);
      margin: 0 auto;
    }
    .real-iphone video { display: block; width: 100%; height: auto; }
    .demo-caption {
      text-align: center; margin-top: 18px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px; letter-spacing: 2px; color: var(--fg-2, #999);
    }
    /* PiP on wider screens: Mac mock behind-left (reused from index), phone front-right */
    @media (min-width: 721px) {
      .demo-stage-v2 .mac { max-width: 620px; margin: 0; opacity: 0.98; }
      .demo-stage-v2 .real-iphone {
        position: absolute; right: 4%; bottom: -20px; margin: 0;
      }
    }
    /* Mobile: phone video is the hero, Mac peeks above it */
    @media (max-width: 720px) {
      .demo-stage-v2 .mac { transform: scale(0.94); transform-origin: top center; }
      .demo-stage-v2 .real-iphone { margin-top: -60px; position: relative; z-index: 2; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="wordmark nav-size">FLIPPED</div>
  <div class="nav-right"><span class="nav-link">DEMO PREVIEW — REAL FOOTAGE</span></div>
</nav>

<section class="walkthrough" style="padding-top:40px;">
  <div class="section-head">
    <div class="eyebrow">HOW IT WORKS</div>
    <h2 class="h2">One tap on your Mac.<br>Apps disappear from your phone.</h2>
    <p class="lede" style="margin-top:10px;">This is a real iPhone. Nothing staged, nothing mocked.</p>
  </div>

  <div class="demo-stage-v2">
    <div class="real-iphone">
      <video autoplay muted loop playsinline poster="" preload="metadata">
        <source src="media/flip-cycle.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="demo-caption">REAL IPHONE · REAL APPS · FLIP AT 0:02 · UNFLIP AT 0:11</div>
  </div>
</section>

<script>
  // Belt-and-braces: some browsers defer muted autoplay until interaction
  // or viewport entry — retry play() on both signals.
  (function () {
    var vid = document.querySelector('video');
    function nudge() { if (vid.paused) vid.play().catch(function () {}); }
    ['scroll', 'touchstart', 'click'].forEach(function (ev) {
      window.addEventListener(ev, nudge, { once: true, passive: true });
    });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) nudge();
      }).observe(vid);
    }
  })();
</script>

</body>
</html>
