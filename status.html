<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status — Flipped</title>
    <!-- Moved 2026-05-21: the live status page is hosted by BetterStack
         at status.useflipped.com.  Meta-refresh + JS for instant redirect;
         noscript link below as the fallback path.  GitHub Pages can't do
         true 301s, so this is the standard "redirect from a static page"
         pattern. -->
    <meta http-equiv="refresh" content="0; url=https://status.useflipped.com/">
    <link rel="canonical" href="https://status.useflipped.com/">
    <script>window.location.replace("https://status.useflipped.com/");</script>
    <style>
        body { background: #0a0a0a; color: #e0e0e0;
               font-family: -apple-system, "Inter", system-ui, sans-serif;
               display: flex; align-items: center; justify-content: center;
               min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .wrap { max-width: 480px; }
        h1 { font-size: 18px; letter-spacing: 3px; margin: 0 0 12px;
             text-transform: uppercase; }
        p { color: rgba(255,255,255,0.6); font-size: 14px;
            line-height: 1.5; margin: 0 0 18px; }
        a { color: #ffba6e; text-decoration: none; font-family: ui-monospace, monospace;
            font-size: 12px; letter-spacing: 1px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <noscript>
        <div class="wrap">
            <h1>Status page moved</h1>
            <p>Flipped's live status now lives at status.useflipped.com.</p>
            <a href="https://status.useflipped.com/">GO TO STATUS.USEFLIPPED.COM →</a>
        </div>
    </noscript>
</body>
</html>
