<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status — Flipped</title>
    <link rel="stylesheet" href="styles.css?v=15" />
    <style>
        .st { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
        .st h1 { font-size: 28px; margin: 0 0 6px; }
        .st .subtitle { color: rgba(255,255,255,0.5);
                        font-size: 13px; margin: 0 0 32px; }
        .pulse-card { padding: 24px;
                      border: 1px solid rgba(255,255,255,0.12);
                      border-radius: 10px;
                      background: rgba(255,255,255,0.02);
                      margin-bottom: 24px; }
        .pulse-headline { display: flex; align-items: center; gap: 14px; }
        .pulse-dot { width: 12px; height: 12px; border-radius: 50%;
                     background: #5fe; box-shadow: 0 0 14px #5fe5; }
        .pulse-dot.warn  { background: #ffba6b; box-shadow: 0 0 14px #ffba6b55; }
        .pulse-dot.error { background: #ff6b6b; box-shadow: 0 0 14px #ff6b6b55; }
        .pulse-label { font-size: 22px; font-weight: 700; }
        .pulse-meta { color: rgba(255,255,255,0.5);
                      font-family: ui-monospace, monospace; font-size: 11px;
                      letter-spacing: 1px; margin-top: 8px;
                      text-transform: uppercase; }
        .components { display: grid; gap: 8px; margin: 18px 0; }
        .comp-row { display: flex; justify-content: space-between;
                    align-items: center; padding: 12px 14px;
                    border: 1px solid rgba(255,255,255,0.08);
                    border-radius: 6px; }
        .comp-name { font-size: 13px; color: rgba(255,255,255,0.85); }
        .comp-status { font-family: ui-monospace, monospace;
                       font-size: 11px; letter-spacing: 1.5px;
                       padding: 3px 9px; border-radius: 999px;
                       background: rgba(95,238,170,0.12); color: #5fe; }
        .comp-status.warn  { background: rgba(255,186,107,0.12); color: #ffba6b; }
        .comp-status.error { background: rgba(255,107,107,0.12); color: #ff8a8a; }
        .timing { color: rgba(255,255,255,0.4);
                  font-family: ui-monospace, monospace;
                  font-size: 10px; margin-left: 12px; }
        .top-link { color: rgba(255,255,255,0.5); font-size: 11px;
                    text-decoration: none; letter-spacing: 1px;
                    font-family: ui-monospace, monospace; }
        .footnote { color: rgba(255,255,255,0.35); font-size: 12px;
                    line-height: 1.6; margin-top: 32px; }
    </style>
</head>
<body>
<div class="st">
    <a href="/" class="top-link">← FLIPPED</a>
    <h1 style="margin-top: 16px;">System status</h1>
    <p class="subtitle" id="subtitle">Checking…</p>

    <div class="pulse-card">
        <div class="pulse-headline">
            <span class="pulse-dot" id="overall-dot"></span>
            <span class="pulse-label" id="overall-label">All systems operational</span>
        </div>
        <div class="pulse-meta" id="overall-meta">Last checked: —</div>
    </div>

    <div class="components" id="components"></div>

    <p class="footnote">
        This page polls our public health endpoints every 30 seconds.
        For incident history beyond what's shown here, email
        <a href="mailto:support@useflipped.com">support@useflipped.com</a>.
    </p>
</div>

<script>
const API = 'https://flipped-production-79b3.up.railway.app';

// Sources we check for "are we up?"  Keep this list short — every entry
// is a public, no-auth endpoint so the status page can be loaded in
// incognito without leaking secrets.
const COMPONENTS = [
    { name: 'API (Flipped backend)',     url: API + '/health',
      ok: r => r.ok,
      timeoutMs: 5000 },
    { name: 'Marketing site',            url: '/',
      ok: r => r.ok,
      timeoutMs: 5000 },
    { name: 'DMG download endpoint',     url: '/downloads/Flipped-latest.dmg',
      method: 'HEAD',
      ok: r => r.ok || r.status === 200,
      timeoutMs: 5000 },
];

function $(id) { return document.getElementById(id); }
function fmtMs(ms) { return ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(2)}s`; }

async function pingComponent(c) {
    const start = performance.now();
    try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), c.timeoutMs);
        const r = await fetch(c.url, { method: c.method || 'GET', signal: ctrl.signal });
        clearTimeout(t);
        const took = Math.round(performance.now() - start);
        return { name: c.name, ok: c.ok(r), status: r.status, took };
    } catch (e) {
        return { name: c.name, ok: false, status: 0, took: Math.round(performance.now() - start) };
    }
}

function pillClass(took, ok) {
    if (!ok) return 'error';
    if (took > 1500) return 'warn';
    return '';
}

async function refresh() {
    const results = await Promise.all(COMPONENTS.map(pingComponent));
    const allOk = results.every(r => r.ok);
    const anySlow = results.some(r => r.ok && r.took > 1500);

    const overallDot = $('overall-dot');
    overallDot.classList.remove('warn', 'error');
    if (!allOk)        { overallDot.classList.add('error');
                         $('overall-label').textContent = 'Partial outage'; }
    else if (anySlow)  { overallDot.classList.add('warn');
                         $('overall-label').textContent = 'Degraded performance'; }
    else                $('overall-label').textContent = 'All systems operational';

    const now = new Date();
    $('overall-meta').textContent = 'Last checked: ' + now.toLocaleTimeString();
    $('subtitle').textContent = 'Live — refreshes every 30s.  ' + (
        allOk ? 'Everything looks good right now.' :
        'One or more components are unreachable.'
    );

    $('components').innerHTML = results.map(r => `
        <div class="comp-row">
            <span class="comp-name">${r.name}</span>
            <span>
                <span class="timing">${fmtMs(r.took)}</span>
                <span class="comp-status ${pillClass(r.took, r.ok)}">
                    ${r.ok ? (r.took > 1500 ? 'SLOW' : 'OPERATIONAL') : 'DOWN'}
                </span>
            </span>
        </div>`).join('');
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
