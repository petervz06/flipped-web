<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FLIPPED — flip your phone, anywhere</title>
    <meta name="description" content="One-tap commitment flips from any browser, any device.  No Mac required." />
    <link rel="stylesheet" href="styles.css?v=15" />
    <style>
        /* ─── Theme tokens, mirroring the Mac app's UITheme2026 ─────────── */
        :root {
            --bg:           #000;
            --surface:      rgba(255,255,255,0.02);
            --surface-up:   rgba(255,255,255,0.04);
            --border:       rgba(255,255,255,0.08);
            --border-up:    rgba(255,255,255,0.16);
            --text:         #fff;
            --text-dim:     rgba(255,255,255,0.65);
            --text-faint:   rgba(255,255,255,0.4);
            --warn:         #ff8a8a;
            --ok:           #5fe;
            --radius:       12px;
            --radius-sm:    8px;
            --hairline:     1px;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
            --display: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", system-ui, sans-serif;
        }

        /* Universal border-box so paddings don't blow past viewport.
           Without this, .shell's max-width + padding overflows on
           mobile and pushes content past the left edge. */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            /* Belt-and-suspenders: even if some descendant tries to
               extend past 100vw, the body clips it.  No horizontal
               scrollbar should ever appear on /flip. */
            overflow-x: hidden;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--display);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ─── Layout: floating-island sidebar mirrors the Mac app ────────── */
        .shell {
            display: flex;
            min-height: 100vh;
            max-width: 880px;
            margin: 0 auto;
            padding: 14px;
            gap: 14px;
        }
        .sidebar {
            width: 160px;
            flex-shrink: 0;
            background: var(--surface-up);
            border: var(--hairline) solid var(--border);
            border-radius: var(--radius);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
        }
        .main {
            flex: 1;
            min-width: 0;
        }

        /* ─── Brand wordmark ─────────────────────────────────────────────── */
        .wordmark {
            font-family: var(--display);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 24px;
        }

        /* ─── Sidebar nav rows: em-dash mark + label, matches Mac app ─────── */
        .nav-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 4px;
            font-size: 14px;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }
        .nav-row:hover { color: var(--text); }
        .nav-row.active { color: var(--text); }
        .nav-row .mark {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-faint);
            width: 12px;
            text-align: center;
        }
        .nav-row.active .mark { color: var(--text); }

        .device-row {
            margin-top: auto;
            display: flex; align-items: center; gap: 10px;
            padding-top: 16px;
            border-top: var(--hairline) solid var(--border);
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--ok);
            flex-shrink: 0;
        }
        .dot.warn { background: var(--warn); }
        .device-meta { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
        .device-meta .sub {
            display: block;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-top: 2px;
        }
        .signout {
            margin-top: 12px;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-faint);
            cursor: pointer;
            text-transform: uppercase;
            background: none; border: none; padding: 4px 0;
            text-align: left;
        }
        .signout:hover { color: var(--warn); }

        /* ─── Main canvas: heading bar ───────────────────────────────────── */
        .h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 6px 0 4px;
        }
        .h-meta {
            color: var(--text-dim);
            font-size: 13px;
            margin: 0 0 24px;
        }

        /* ─── Cards (the "mega tile" pattern from the Mac app) ───────────── */
        .card {
            background: var(--surface);
            border: var(--hairline) solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
        }
        .card + .card { margin-top: 14px; }
        .label {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-faint);
        }
        .display {
            font-family: var(--display);
            font-size: 24px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .muted { color: var(--text-dim); font-size: 13px; line-height: 1.5; }

        .divider {
            height: var(--hairline);
            background: var(--border);
            margin: 18px 0;
        }

        /* ─── Active profile mini-row (between status + FLIP button) ─────── */
        .active-profile {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 0;
        }
        .active-profile .name {
            font-weight: 600;
            font-size: 14px;
        }
        .active-profile .change {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
            cursor: pointer;
            background: none; border: none; padding: 4px 8px;
        }
        .active-profile .change:hover { color: var(--text); }

        /* ─── Buttons ────────────────────────────────────────────────────── */
        .btn-flip {
            width: 100%;
            padding: 16px;
            background: var(--text);
            color: #000;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.12s;
        }
        .btn-flip:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-flip:hover:not(:disabled) { opacity: 0.92; }
        .btn-mode {
            background: transparent;
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: var(--mono);
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            min-width: 84px;
        }
        .btn-mode:hover { background: var(--surface-up); }
        .btn-mode.active { background: var(--text); color: #000; border-color: var(--text); }

        /* ─── Mode picker grid ───────────────────────────────────────────── */
        .picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        /* ─── Status / error pills ──────────────────────────────────────── */
        .status {
            margin-top: 14px;
            font-size: 13px;
            color: var(--ok);
        }
        .status.warn { color: var(--warn); }

        /* ─── Locked active session view ─────────────────────────────────── */
        .locked-time {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 56px;
            text-align: center;
            margin: 12px 0;
        }
        .locked-meta {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .blocked-block {
            margin-top: 16px;
            padding-top: 14px;
            border-top: var(--hairline) solid var(--border);
        }
        .blocked-label {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
        }
        .blocked-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 10px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .blocked-list .item {
            white-space: nowrap;
        }
        .blocked-list .sep {
            color: var(--text-faint);
        }
        .locked-tip {
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            line-height: 1.6;
            margin-top: 14px;
            padding-top: 14px;
            border-top: var(--hairline) solid var(--border);
        }

        /* ─── License-key sign-in card (shown only when not signed in) ──── */
        .signin-shell {
            max-width: 440px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .signin-input {
            width: 100%;
            padding: 14px;
            font-family: var(--mono);
            font-size: 16px; /* iOS Safari auto-zooms inputs <16px — keep flush. */
            letter-spacing: 1px;
            background: var(--surface);
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            margin: 14px 0;
            box-sizing: border-box;
        }
        .signin-input:focus {
            outline: none;
            border-color: var(--text);
        }

        /* ─── Mobile (sidebar collapses to top bar) ──────────────────────── */
        @media (max-width: 720px) {
            .shell {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
                max-width: 100%;
            }
            .sidebar {
                width: auto;
                padding: 14px 16px;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px 16px;
            }
            /* Brand wordmark sits left, nav rows compact next to it */
            .wordmark {
                margin-bottom: 0;
                font-size: 13px;
                letter-spacing: 3px;
            }
            .nav-row { padding: 4px 6px; }
            /* Device row + sign-out wrap below the brand on a narrow row */
            .device-row {
                margin: 0 0 0 auto;
                padding: 0;
                border: none;
                gap: 8px;
            }
            .device-meta { font-size: 11px; }
            .signout {
                margin: 0;
                font-size: 10px;
                letter-spacing: 2px;
                padding: 6px 10px;
                border: var(--hairline) solid var(--border-up);
                border-radius: 6px;
                color: var(--text-dim);
            }
            .signout:hover { color: var(--warn); border-color: var(--warn); }
            /* Cards: tighter padding, smaller hero copy */
            .card { padding: 20px 18px; }
            .h1 { font-size: 19px; }
            .display { font-size: 20px; }
            .locked-time { font-size: 44px; }
            .picker-grid {
                grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
                gap: 6px;
            }
            .btn-mode {
                min-width: 0;
                padding: 9px 8px;
                font-size: 10px;
                letter-spacing: 1.5px;
            }
            .signin-shell { margin: 24px auto; padding: 0 14px; }
        }
        /* Extra-narrow phones: collapse picker to two columns so the
           DURATION grid never crops. */
        @media (max-width: 380px) {
            .picker-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
const API = 'https://flipped-production-79b3.up.railway.app';
const LS = {
    token:   'flipped.web.token',
    device:  'flipped.web.deviceId',
    profile: 'flipped.web.activeProfile',
    tab:     'flipped.web.tab',
};

// Profiles mirror BlockProfile.swift presets — keep in lockstep when the
// Mac app's preset list changes.  Custom profiles are Mac-side only for
// now; the web flip uses presets.
// Bundle-ID → friendly name lookup used by the active-session view to
// show the user exactly which apps are hidden on their iPhone.  Same
// list the Mac app uses (Flipped/Models/FriendlyAppNames.swift) — keep
// in sync when adding apps to a preset.
const APP_NAMES = {
    'com.burbn.instagram':              'Instagram',
    'com.zhiliaoapp.musically':         'TikTok',
    'com.atebits.Tweetie2':             'X',
    'com.toyopagroup.picaboo':          'Snapchat',
    'com.facebook.Facebook':            'Facebook',
    'com.reddit.Reddit':                'Reddit',
    'com.pinterest':                    'Pinterest',
    'com.burbn.barcelona':              'Threads',
    'xyz.blueskyweb.app':               'Bluesky',
    'com.alphaexploration.chrono':      'BeReal',
    'com.tumblr':                       'Tumblr',
    'org.joinmastodon.app':             'Mastodon',
    'com.linkedin.LinkedIn':            'LinkedIn',
    'com.google.ios.youtube':           'YouTube',
    'com.google.ios.youtubeunplugged':  'YouTube TV',
    'com.google.ios.ytcreator':         'YouTube Studio',
    'com.netflix.Netflix':              'Netflix',
    'com.hulu.plus':                    'Hulu',
    'com.disney.disneyplus':            'Disney+',
    'com.wbd.hbomax':                   'HBO Max',
    'com.hbo.hbonow':                   'HBO Now',
    'tv.twitch':                        'Twitch',
    'com.peacocktv.peacock':            'Peacock',
    'com.amazon.aiv.AIVApp':            'Prime Video',
    'com.cbsplayer.PARAMOUNTPLUSAPP':   'Paramount+',
    'com.apple.news':                   'Apple News',
    'com.flipboard.flipboard':          'Flipboard',
    'com.robinhood.release.Robinhood':  'Robinhood',
    'com.coinbase.iphone-client':       'Coinbase',
    'com.amazon.Amazon':                'Amazon',
    'com.ebay.iphone':                  'eBay',
};

function friendlyAppName(bundleId) {
    return APP_NAMES[bundleId] || bundleId;
}

const PROFILES = {
    'preset-simple': {
        id: 'preset-simple', name: 'Simple', mode: 'social',
        tagline: 'No social or entertainment.  Discord, work, music stay.',
        bundleIds: [
            'com.burbn.instagram','com.zhiliaoapp.musically','com.atebits.Tweetie2',
            'com.toyopagroup.picaboo','com.facebook.Facebook','com.reddit.Reddit',
            'com.pinterest','com.burbn.barcelona','xyz.blueskyweb.app',
            'com.alphaexploration.chrono','com.tumblr','org.joinmastodon.app',
            'com.linkedin.LinkedIn','com.google.ios.youtube',
            'com.google.ios.youtubeunplugged','com.google.ios.ytcreator',
            'com.netflix.Netflix','com.hulu.plus','com.disney.disneyplus',
            'com.wbd.hbomax','com.hbo.hbonow','tv.twitch',
            'com.peacocktv.peacock','com.amazon.aiv.AIVApp',
            'com.cbsplayer.PARAMOUNTPLUSAPP',
        ],
    },
    'preset-deep-work': {
        id: 'preset-deep-work', name: 'Deep Work', mode: 'focus',
        tagline: 'Block social, games, shopping, news, investing.',
        bundleIds: [
            'com.burbn.instagram','com.zhiliaoapp.musically','com.atebits.Tweetie2',
            'com.toyopagroup.picaboo','com.facebook.Facebook','com.reddit.Reddit',
            'com.pinterest','com.burbn.barcelona','com.apple.news',
            'com.flipboard.flipboard','com.robinhood.release.Robinhood',
            'com.coinbase.iphone-client','com.amazon.Amazon','com.ebay.iphone',
            'com.google.ios.youtube','com.netflix.Netflix',
        ],
    },
};

// Home FLIP starts a *manual* session — no end date, only quittable from
// the Mac app.  Modes tab is for committing to a fixed duration (Focus or
// Unplug), matching the Mac app's ModesView structure exactly.
const FOCUS_DURATIONS = [
    { label: '30 min',  seconds:  30 * 60 },
    { label: '1 hour',  seconds:  60 * 60 },
    { label: '2 hours', seconds:   2 * 3600 },
    { label: '4 hours', seconds:   4 * 3600 },
    { label: '8 hours', seconds:   8 * 3600 },
    { label: '24 hours',seconds:  24 * 3600 },
];
const UNPLUG_DURATIONS = [
    { label: '1 day',   seconds:        24 * 3600 },
    { label: '3 days',  seconds:    3 * 24 * 3600 },
    { label: '7 days',  seconds:    7 * 24 * 3600 },
    { label: '14 days', seconds:   14 * 24 * 3600 },
    { label: '30 days', seconds:   30 * 24 * 3600 },
    { label: '1 year',  seconds:  365 * 24 * 3600 },
];

let state = {
    token:        localStorage.getItem(LS.token)   || null,
    deviceId:     localStorage.getItem(LS.device)  || null,
    profileId:    localStorage.getItem(LS.profile) || 'preset-simple',
    tab:          localStorage.getItem(LS.tab)     || 'home',
    activeSession: null,
    // Modes sub-tab: 'focus' or 'unplug'
    modeTab:      'focus',
    focusDuration: 60 * 60,
    unplugDuration: 24 * 3600,
    error:        null,
    busy:         false,
    // Sign-in flow: 'email' (initial) → 'code' (after we email a 6-digit code)
    signInPhase:  'email',
    signInEmail:  null,
};

function $(id) { return document.getElementById(id); }
function persist(key, value) {
    if (value == null) localStorage.removeItem(LS[key]);
    else localStorage.setItem(LS[key], value);
}

async function api(path, opts = {}) {
    opts.headers = opts.headers || {};
    if (state.token) opts.headers['Authorization'] = `Bearer ${state.token}`;
    if (opts.body && typeof opts.body !== 'string') {
        opts.body = JSON.stringify(opts.body);
        opts.headers['Content-Type'] = 'application/json';
    }
    const r = await fetch(API + path, opts);
    if (!r.ok) {
        // 401/403 on any authed call means the JWT is stale (token rotated
        // after a backend deploy, account password change, etc.).  Drop it
        // and route back to the sign-in screen so the user doesn't have to
        // hunt for the "Sign out" button manually.  Pre-1.0.43 this just
        // surfaced "Invalid or expired token" under the START button while
        // the header still said "ONLINE · idle," which read as broken.
        if ((r.status === 401 || r.status === 403) && state.token) {
            state.token = null;
            state.deviceId = null;
            state.activeSession = null;
            state.signInPhase = 'email';
            state.signInEmail = null;
            state.error = 'Session expired — sign in again with your email.';
            persist('token', null);
            persist('device', null);
            render();
            throw new Error('session_expired');
        }
        let detail = '';
        try { detail = (await r.json()).detail || ''; } catch (_) {}
        throw new Error(detail || `HTTP ${r.status}`);
    }
    if (r.status === 204) return null;
    return r.json();
}

async function refreshActiveSession() {
    if (!state.token) return;
    try {
        const data = await api('/api/sessions/active');
        state.activeSession = data && data.session ? data.session : null;
    } catch (e) {
        if (!String(e).includes('404')) console.warn(e);
        state.activeSession = null;
    }
    // Also re-check device — covers the "I just enrolled my iPhone via Mac"
    // case where the user's already signed into the web with a stale (no-
    // device) token, plus the boot path where we restore a token from
    // localStorage but never fetched the deviceId.
    try {
        const ds = await api('/api/devices/status');
        if (ds && ds.device) {
            state.deviceId = ds.device.id;
            persist('device', state.deviceId);
        }
    } catch (e) {
        // 404 = no device on this account; leave deviceId null so the FLIP
        // button surfaces the "no iPhone enrolled" hint.
        if (!String(e).includes('404')) console.warn(e);
    }
    // Pull the Mac-synced active profile (v1.0.48 — Sam-fix).  Pre-1.0.48
    // the web fell back to PROFILES['preset-simple'] for any custom slug
    // because it had no way to know about custom profiles.  Now the Mac
    // PUTs /api/me/active-profile whenever the user picks/edits a profile,
    // and we read it here so the next flip carries the right bundles.
    // 404 = nothing synced yet (legacy user, or never picked); fine, the
    // pre-1.0.48 PROFILES fallback path still works.
    try {
        const ap = await api('/api/me/active-profile');
        if (ap && Array.isArray(ap.bundle_ids)) {
            state.macActiveProfile = ap;
        }
    } catch (e) {
        if (!String(e).includes('404')) console.warn(e);
        state.macActiveProfile = null;
    }
}

// ─── Sign-in (email + 6-digit code) ─────────────────────────────────────
// Two-phase: enter email → backend emails a code → enter code → JWT.
// Mirrors the Mac app's onboarding step 1 exactly.

async function requestEmailCode(email) {
    state.busy = true; state.error = null; render();
    try {
        const r = await fetch(API + '/api/auth/email/request-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Client': 'web'},
            body: JSON.stringify({email: email.trim().toLowerCase()}),
        });
        // 204 = code sent.  429 = rate-limited (per-email + per-IP).  404 =
        // either the email isn't on file OR the backend route is temporarily
        // unavailable — surface a friendlier message that points users to
        // the Mac onboarding so they don't sit waiting for an email that
        // never arrives.  Pete reported the silent-failure UX 2026-05-13.
        if (r.status === 429) throw new Error('Too many attempts — wait a minute and try again.');
        if (r.status === 404) throw new Error("We don't have an account for that email yet — sign up from the Mac app first, then come back here to flip from the web.");
        if (!r.ok && r.status !== 204) throw new Error(`HTTP ${r.status}`);
        // Success: advance to the code-entry phase.
        state.signInEmail = email.trim().toLowerCase();
        state.signInPhase = 'code';
    } catch (e) {
        state.error = e.message || 'Network error.';
    } finally {
        state.busy = false; render();
    }
}

async function verifyEmailCode(code) {
    state.busy = true; state.error = null; render();
    try {
        const r = await fetch(API + '/api/auth/email/verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: state.signInEmail,
                code:  code.trim(),
            }),
        });
        if (!r.ok) {
            const detail = (await r.json().catch(() => ({}))).detail
                || (r.status === 400 ? 'Invalid or expired code.'
                  : r.status === 429 ? 'Too many attempts — try again later.'
                  : `HTTP ${r.status}`);
            throw new Error(detail);
        }
        const body = await r.json();
        state.token = body.access_token;
        persist('token', state.token);
        // Try device-status; ok if no device yet.
        const ds = await api('/api/devices/status').catch(() => null);
        if (ds && ds.device) {
            state.deviceId = ds.device.id;
            persist('device', state.deviceId);
        }
        await refreshActiveSession();
        // Reset sign-in state for next time.
        state.signInPhase = 'email'; state.signInEmail = null;
    } catch (e) {
        state.error = e.message;
    } finally {
        state.busy = false; render();
    }
}

function backToEmailEntry() {
    state.signInPhase = 'email';
    state.error = null;
    state.signInEmail = null;
    render();
}

function signOut() {
    if (!confirm('Sign out of this device?  You\'ll need a fresh sign-in code to return.')) return;
    state.token = null; state.deviceId = null; state.activeSession = null;
    state.signInPhase = 'email'; state.signInEmail = null;
    persist('token', null); persist('device', null);
    render();
}

// ─── Session control ────────────────────────────────────────────────────
// Manual flip from Home: no duration, only quittable from the Mac app.
// Mirrors the Mac app's HomeView FLIP button.
async function startManualFlip(profileId) {
    if (!state.deviceId) {
        state.error = 'No iPhone on this account.  Make sure you signed in with the same email the Mac app uses.';
        render(); return;
    }
    state.busy = true; state.error = null; render();
    try {
        // v1.0.48 — prefer the Mac-synced active profile (lets web see
        // custom profiles).  Fall back to the hardcoded PROFILES dict so
        // legacy users without an active-profile sync still flip cleanly,
        // and finally to preset-simple if neither knows about the slug.
        const profile = resolveFlipProfile(profileId);
        await api('/api/sessions/start', {
            method: 'POST',
            body: {
                device_id: state.deviceId,
                mode: profile.mode,
                // No duration_seconds → manual session.  Only the Mac app
                // can end it (no commitment lock, no web escape needed).
                blocked_bundle_ids: profile.bundleIds,
            },
        });
        await refreshActiveSession();
    } catch (e) {
        state.error = e.message;
    } finally {
        state.busy = false; render();
    }
}

// Resolve a flip request to a {mode, bundleIds} pair.  Priority:
//   1. Mac-synced active profile (covers custom profiles created on Mac)
//   2. Hardcoded PROFILES dict (covers presets when nothing's synced)
//   3. preset-simple fallback (legacy behavior; web never shows nothing)
// Pre-1.0.48 we only had #2 → #3, which is why Sam's custom profile
// silently got replaced with Simple when he flipped from web.
function resolveFlipProfile(profileId) {
    const synced = state.macActiveProfile;
    if (synced && Array.isArray(synced.bundle_ids)
        && (synced.slug === profileId || !PROFILES[profileId])) {
        return {
            mode:      synced.mode || 'focus',
            bundleIds: synced.bundle_ids,
        };
    }
    return PROFILES[profileId] || PROFILES['preset-simple'];
}

// Committed flip from Modes tab: fixed duration, locked from the web,
// emergency-unflip from the Mac app only (Focus 1×/month).
async function startCommittedFlip(mode, durationSec) {
    if (!state.deviceId) {
        state.error = 'No iPhone on this account.  Make sure you signed in with the same email the Mac app uses.';
        render(); return;
    }
    state.busy = true; state.error = null; render();
    try {
        // Modes use the active profile's bundle list — same contract as
        // Mac ModesView (profile = WHAT, mode = HOW LONG).  Same Mac-sync
        // preference as startManualFlip — see resolveFlipProfile above.
        const profile = resolveFlipProfile(state.profileId);
        await api('/api/sessions/start', {
            method: 'POST',
            body: {
                device_id: state.deviceId,
                mode: mode,                  // 'focus' or 'unplug'
                duration_seconds: durationSec,
                blocked_bundle_ids: profile.bundleIds,
            },
        });
        await refreshActiveSession();
    } catch (e) {
        state.error = e.message;
    } finally {
        state.busy = false; render();
    }
}

// ─── Helpers ────────────────────────────────────────────────────────────
function fmtRemaining(session) {
    if (!session.endDate && !session.expires_at) return 'IN SESSION';
    const end = new Date(session.expires_at || session.endDate);
    const ms = end - new Date();
    if (ms <= 0) return '0m';
    const m = Math.floor(ms / 60000);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
}

function setTab(t) { state.tab = t; persist('tab', t); render(); }
function setProfile(id) { state.profileId = id; persist('profile', id); render(); }
function setModeTab(m) { state.modeTab = m; render(); }
function setFocusDuration(s) { state.focusDuration = s; render(); }
function setUnplugDuration(s) { state.unplugDuration = s; render(); }

// ─── Render ─────────────────────────────────────────────────────────────
function render() {
    const root = $('root');
    if (!state.token) { root.innerHTML = renderSignIn(); return; }
    root.innerHTML = renderApp();
}

// Inline-onclick helpers — readInput at click-time so they work regardless
// of when the listener was attached (innerHTML strips <script> tags).
function submitEmailRequest() {
    const el = document.getElementById('email-input');
    if (!el) return;
    requestEmailCode(el.value);
}
function submitCodeVerify() {
    const el = document.getElementById('code-input');
    if (!el) return;
    verifyEmailCode(el.value);
}

function renderSignIn() {
    if (state.signInPhase === 'code') return renderCodeEntry();
    return renderEmailEntry();
}

function renderEmailEntry() {
    return `
    <div class="signin-shell">
        <div class="wordmark">FLIPPED</div>
        <div class="card">
            <div class="label">SIGN IN</div>
            <div class="display">Enter your email</div>
            <p class="muted">
                We'll email you a 6-digit code.  Same email you used to
                sign in to the Mac app.
            </p>
            <input id="email-input" class="signin-input"
                   type="email"
                   placeholder="you@example.com"
                   autocomplete="email"
                   spellcheck="false"
                   onkeydown="if (event.key === 'Enter') submitEmailRequest();" />
            <button class="btn-flip"
                    onclick="submitEmailRequest()"
                    ${state.busy ? 'disabled' : ''}>
                ${state.busy ? 'SENDING…' : 'SEND CODE →'}
            </button>
            ${state.error ? `<div class="status warn">${state.error}</div>` : ''}
        </div>
    </div>
    `;
}

function renderCodeEntry() {
    return `
    <div class="signin-shell">
        <div class="wordmark">FLIPPED</div>
        <div class="card">
            <div class="label">CHECK YOUR EMAIL</div>
            <div class="display">Enter the 6-digit code</div>
            <p class="muted">
                We sent it to <strong style="color: var(--text)">${
                    state.signInEmail ? escapeHtml(state.signInEmail) : 'your inbox'
                }</strong>.  Codes expire in 10 minutes.  iCloud
                sometimes takes 30-60s to deliver.
            </p>
            <input id="code-input" class="signin-input"
                   type="text"
                   inputmode="numeric"
                   maxlength="6"
                   placeholder="123456"
                   autocomplete="one-time-code"
                   spellcheck="false"
                   style="letter-spacing: 6px; text-align: center;"
                   onkeydown="if (event.key === 'Enter') submitCodeVerify();" />
            <button class="btn-flip"
                    onclick="submitCodeVerify()"
                    ${state.busy ? 'disabled' : ''}>
                ${state.busy ? 'VERIFYING…' : 'VERIFY →'}
            </button>
            <button class="signout" onclick="backToEmailEntry()" style="margin-top:14px;">
                — Use a different email
            </button>
            ${state.error ? `<div class="status warn">${state.error}</div>` : ''}
        </div>
    </div>
    `;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderApp() {
    const session = state.activeSession;
    return `
    <div class="shell">
        <aside class="sidebar">
            <div class="wordmark">FLIPPED</div>
            <div class="nav-row ${state.tab === 'home' ? 'active' : ''}"
                 onclick="setTab('home')">
                <span class="mark">—</span>
                <span>Home</span>
            </div>
            <div class="nav-row ${state.tab === 'modes' ? 'active' : ''}"
                 onclick="setTab('modes')">
                <span class="mark">—</span>
                <span>Modes</span>
            </div>
            <div class="device-row">
                <span class="dot ${state.deviceId ? '' : 'warn'}"></span>
                <span class="device-meta">
                    ${state.deviceId ? 'iPhone' : 'No device'}
                    <span class="sub">
                        ${session ? 'Flipped · ' + fmtRemaining(session)
                                  : (state.deviceId ? 'Online · idle' : 'Not paired')}
                    </span>
                </span>
            </div>
            <button class="signout" onclick="signOut()">— Sign out</button>
        </aside>
        <main class="main">
            ${session ? renderActiveSession(session)
                      : (!state.deviceId ? renderNoDevice()
                      : (state.tab === 'home' ? renderHome() : renderModes()))}
        </main>
    </div>
    `;
}

// Shown when the signed-in account has no enrolled iPhone — usually
// means the user signed in with a different email than their Mac app
// uses.  Surface a prominent "use a different email" affordance so
// they can recover without hunting for the tiny sign-out link.
function renderNoDevice() {
    return `
    <h1 class="h1">No iPhone on this account</h1>
    <p class="h-meta">This email isn't linked to an enrolled iPhone.</p>
    <div class="card">
        <div class="label">WHAT TO DO</div>
        <div class="display">Use the same email as your Mac app</div>
        <p class="muted">
            The web flip needs the email tied to the account your
            Mac app + iPhone are already using.  Sign out and try
            again with the matching email.
        </p>
        <div class="divider"></div>
        <button class="btn-flip" onclick="signOut()">USE A DIFFERENT EMAIL →</button>
    </div>
    `;
}

function renderHome() {
    const profile = PROFILES[state.profileId] || PROFILES['preset-simple'];
    return `
    <h1 class="h1">Flip your phone</h1>
    <p class="h-meta">One tap — flips immediately, ends when you say so.</p>
    <div class="card">
        <div class="label">STATUS</div>
        <div class="display">Phone is free</div>
        <p class="muted">Tapping FLIP starts a manual session — your iPhone
            hides distractions right away.  Open Flipped on your Mac to end
            it whenever you're ready.  Use Modes for a fixed-duration commit.</p>
        <div class="divider"></div>
        <div class="active-profile">
            <div>
                <div class="label">ACTIVE PROFILE</div>
                <div class="name">${profile.name}</div>
            </div>
            <button class="change" onclick="setTab('modes')">CHANGE →</button>
        </div>
        <div class="divider"></div>
        <button class="btn-flip" ${state.busy ? 'disabled' : ''}
                onclick="startManualFlip('${profile.id}')">
            ${state.busy ? 'STARTING…' : '▶ FLIP'}
        </button>
        ${state.error ? `<div class="status warn">${state.error}</div>` : ''}
    </div>
    `;
}

function renderModes() {
    const isFocus = state.modeTab === 'focus';
    const blurb = isFocus
        ? 'Lock in for a few hours.  Quittable from the Mac app once a month — that\'s your one escape.'
        : 'Long-haul commitment.  Days to a year.  Quittable from the Mac app, but the longer you go, the harder it gets.';
    const durations = isFocus ? FOCUS_DURATIONS : UNPLUG_DURATIONS;
    const selected  = isFocus ? state.focusDuration : state.unplugDuration;
    const setter    = isFocus ? 'setFocusDuration' : 'setUnplugDuration';
    return `
    <h1 class="h1">Modes</h1>
    <p class="h-meta">Pick a duration to commit.  Profile decides what gets blocked.</p>

    <div class="card">
        <div class="picker-grid" style="grid-template-columns: 1fr 1fr; margin: 0 0 18px;">
            <button class="btn-mode ${isFocus ? 'active' : ''}"
                    onclick="setModeTab('focus')">FOCUS</button>
            <button class="btn-mode ${!isFocus ? 'active' : ''}"
                    onclick="setModeTab('unplug')">UNPLUG</button>
        </div>
        <p class="muted">${blurb}</p>

        <div class="divider"></div>
        <div class="label">PROFILE</div>
        <div class="picker-grid" style="margin-top: 10px;">
            ${Object.values(PROFILES).map(p => `
                <button class="btn-mode ${state.profileId === p.id ? 'active' : ''}"
                        onclick="setProfile('${p.id}')">
                    ${p.name.toUpperCase()}
                </button>
            `).join('')}
        </div>
        <p class="muted" style="margin-top: 12px; font-size: 12px;">
            ${PROFILES[state.profileId].tagline}
        </p>

        <div class="divider"></div>
        <div class="label">DURATION</div>
        <div class="picker-grid" style="margin-top: 10px;">
            ${durations.map(d => `
                <button class="btn-mode ${selected === d.seconds ? 'active' : ''}"
                        onclick="${setter}(${d.seconds})">
                    ${d.label.toUpperCase()}
                </button>
            `).join('')}
        </div>

        <div class="divider"></div>
        <button class="btn-flip" ${state.busy ? 'disabled' : ''}
                onclick="startCommittedFlip('${isFocus ? 'focus' : 'unplug'}', ${selected})">
            ${state.busy ? 'STARTING…' : (isFocus ? '▶ START FOCUS' : '▶ UNPLUG')}
        </button>
        ${state.error ? `<div class="status warn">${state.error}</div>` : ''}
    </div>
    `;
}

function renderActiveSession(session) {
    const hasTimer = !!(session.expires_at || session.endDate);
    const tipBody = hasTimer
        ? `To end early: open Flipped on your Mac and tap
           <strong style="color: var(--text)">EMERGENCY UNFLIP</strong>
           (Focus mode, 1×/month).  Otherwise the timer runs out on its
           own and your apps return.`
        : `Open Flipped on your Mac and tap
           <strong style="color: var(--text)">UNFLIP</strong>
           whenever you're ready.  Manual sessions don't expire on their
           own — that's the point.`;

    // Surface the list of apps currently hidden on the phone.  Prefer
    // the server-provided blocked_bundle_ids (accurate regardless of
    // which client started the session); fall back to the website's
    // remembered profile when older sessions don't yet have the field.
    const serverBundles = Array.isArray(session.blocked_bundle_ids)
        ? session.blocked_bundle_ids
        : null;
    const profileBundles =
        (PROFILES[state.profileId] && PROFILES[state.profileId].bundleIds) || [];
    const sourceBundles = (serverBundles && serverBundles.length > 0)
        ? serverBundles
        : profileBundles;
    const blockedItems = sourceBundles
        .map(friendlyAppName)
        .filter(Boolean);
    const blockedHTML = blockedItems.length === 0 ? '' : `
        <div class="blocked-block">
            <div class="blocked-label">— Hidden right now (${blockedItems.length}) —</div>
            <div class="blocked-list">
                ${blockedItems.map((name, i) => `
                    <span class="item">${name}</span>${
                        i < blockedItems.length - 1 ? '<span class="sep">·</span>' : ''
                    }
                `).join('')}
            </div>
        </div>`;

    // Manual flips (no timer) get a web-end button as of 2026-05-13 —
    // pre-fix, the asymmetry where Mac could create a manual session
    // but only Mac could end it created a stuck state: if Mac's
    // endFlip API call failed silently, web showed "in session" with
    // no recovery path.  Now web can end manual sessions too.
    // Committed flips (focus/unplug with a timer) keep the lockdown —
    // those are the commitment-device sessions where one-click web
    // unflip would defeat the purpose.
    const manualEndButton = hasTimer ? '' : `
        <button class="primary"
                ${state.busy ? 'disabled' : ''}
                style="margin-top: 18px; background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border);"
                onclick="endManualFlip()">
            ${state.busy ? 'UNFLIPPING…' : '◼ UNFLIP'}
        </button>
        ${state.error ? `<div class="status warn" style="margin-top:10px">${state.error}</div>` : ''}
    `;

    return `
    <h1 class="h1">In session</h1>
    <p class="h-meta">${hasTimer
        ? 'Web flip is one-way.  Wait for the timer or use your Mac app’s emergency unflip.'
        : 'Manual session.  Unflip here or from your Mac — both work.'}</p>
    <div class="card">
        <div class="locked-meta">PHONE IS FLIPPED · MODE: ${(session.mode || '').toUpperCase()}</div>
        <div class="locked-time">${hasTimer ? fmtRemaining(session) : '∞'}</div>
        <div class="locked-meta">${hasTimer ? 'REMAINING' : 'MANUAL · NO TIMER'}</div>
        ${blockedHTML}
        <div class="locked-tip">${tipBody}</div>
        ${manualEndButton}
    </div>
    `;
}

// End a manual (no-timer) session from the web.  Calls the same
// DELETE /api/sessions/active endpoint the Mac uses.  Backend queues
// RemoveProfile + APNs push, retry task picks it up if the first
// push fails to reach the iPhone.  Web is unaware whether the
// session was started from Mac or web — the user just wants out
// and the server is the authority on session state.
async function endManualFlip() {
    state.busy = true; state.error = null; render();
    try {
        const r = await fetch(API + '/api/sessions/active', {
            method: 'DELETE',
            headers: {'Authorization': `Bearer ${state.token}`},
        });
        // 204 = ended, 404 = nothing to end (already gone — also a win)
        if (r.status !== 204 && r.status !== 404) {
            throw new Error(`HTTP ${r.status}`);
        }
        state.activeSession = null;
        await refreshActiveSession();
    } catch (e) {
        state.error = `Couldn't unflip: ${e.message}.  Try again or use your Mac app.`;
    } finally {
        state.busy = false; render();
    }
}

// ─── Boot + periodic refresh ────────────────────────────────────────────
(async function () {
    if (state.token) {
        try { await refreshActiveSession(); }
        catch (_) {
            // Token expired — drop it, force re-redeem
            state.token = null; persist('token', null);
        }
    }
    render();
    // Refresh active session every 5s, matching the Mac app's poll cadence.
    // Keeps the web view in sync with sessions started or ended on the Mac
    // (or vice versa) within the same window users perceive as "instant."
    setInterval(() => {
        if (state.token) refreshActiveSession().then(render);
    }, 5000);
})();
</script>
</body>
</html>
