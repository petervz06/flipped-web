<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FLIPPED — flip your phone, anywhere</title>
    <meta name="description" content="One-tap commitment flips from any browser, any device.  No Mac required." />
    <!-- PWA: installable to the iPhone Home Screen — real icon, full-screen,
         no Safari chrome.  Unflip still lives on the Mac; this is the
         flip-only surface. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flipped" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="styles.css?v=15" />
    <style>
        /* ─── Theme tokens, mirroring the Mac app's UITheme2026 ─────────── */
        :root {
            --bg:           #000;
            --surface:      rgba(255,255,255,0.02);
            --surface-up:   rgba(255,255,255,0.04);
            --border:       rgba(255,255,255,0.08);
            --border-up:    rgba(255,255,255,0.16);
            --text:         #fff;
            --text-dim:     rgba(255,255,255,0.65);
            --text-faint:   rgba(255,255,255,0.4);
            --warn:         #ff8a8a;
            --ok:           #5fe;
            --radius:       12px;
            --radius-sm:    8px;
            --hairline:     1px;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
            --display: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", system-ui, sans-serif;
        }

        /* Universal border-box so paddings don't blow past viewport.
           Without this, .shell's max-width + padding overflows on
           mobile and pushes content past the left edge. */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            /* Belt-and-suspenders: even if some descendant tries to
               extend past 100vw, the body clips it.  No horizontal
               scrollbar should ever appear on /flip. */
            overflow-x: hidden;
        }
        html {
            /* Kill the iOS rubber-band flash: no overscroll chaining, and
               the canvas behind any bounce is the same black as the app. */
            overscroll-behavior-y: none;
            background: #000;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--display);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ─── Layout: floating-island sidebar mirrors the Mac app ────────── */
        .shell {
            display: flex;
            min-height: 100vh;
            max-width: 880px;
            margin: 0 auto;
            padding: 14px;
            gap: 14px;
        }
        .sidebar {
            width: 160px;
            flex-shrink: 0;
            background: var(--surface-up);
            border: var(--hairline) solid var(--border);
            border-radius: var(--radius);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
        }
        .main {
            flex: 1;
            min-width: 0;
        }

        /* ─── Brand wordmark ─────────────────────────────────────────────── */
        .wordmark {
            font-family: var(--display);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 24px;
        }

        /* ─── Sidebar nav rows: em-dash mark + label, matches Mac app ─────── */
        .nav-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 4px;
            font-size: 14px;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }
        .nav-row:hover { color: var(--text); }
        .nav-row.active { color: var(--text); }
        .nav-row .mark {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-faint);
            width: 12px;
            text-align: center;
        }
        .nav-row.active .mark { color: var(--text); }

        .device-row {
            margin-top: auto;
            display: flex; align-items: center; gap: 10px;
            padding-top: 16px;
            border-top: var(--hairline) solid var(--border);
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--ok);
            flex-shrink: 0;
        }
        .dot.warn { background: var(--warn); }
        .device-meta { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
        .device-meta .sub {
            display: block;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-top: 2px;
        }
        .signout {
            margin-top: 12px;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-faint);
            cursor: pointer;
            text-transform: uppercase;
            background: none; border: none; padding: 4px 0;
            text-align: left;
        }
        .signout:hover { color: var(--warn); }

        /* ─── Main canvas: heading bar ───────────────────────────────────── */
        .h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 6px 0 4px;
            /* styles.css sets a marketing-hero -2.2px on h1 — sized for
               46px+ heroes, unreadable at app scale.  Undo it here. */
            letter-spacing: -0.3px;
        }
        .h-meta {
            color: var(--text-dim);
            font-size: 13px;
            margin: 0 0 24px;
        }

        /* ─── Cards (the "mega tile" pattern from the Mac app) ───────────── */
        .card {
            background: var(--surface);
            border: var(--hairline) solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
        }
        .card + .card { margin-top: 14px; }
        .label {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-faint);
        }
        .display {
            font-family: var(--display);
            font-size: 24px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .muted { color: var(--text-dim); font-size: 13px; line-height: 1.5; }

        .divider {
            height: var(--hairline);
            background: var(--border);
            margin: 18px 0;
        }

        /* ─── Active profile mini-row (between status + FLIP button) ─────── */
        .active-profile {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 0;
        }
        .active-profile .name {
            font-weight: 600;
            font-size: 14px;
        }
        .active-profile .change {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
            cursor: pointer;
            background: none; border: none; padding: 4px 8px;
        }
        .active-profile .change:hover { color: var(--text); }

        /* ─── Buttons ────────────────────────────────────────────────────── */
        .btn-flip {
            width: 100%;
            padding: 16px;
            background: var(--text);
            color: #000;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.12s;
        }
        .btn-flip:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-flip:hover:not(:disabled) { opacity: 0.92; }
        .btn-mode {
            background: transparent;
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: var(--mono);
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            min-width: 84px;
        }
        .btn-mode:hover { background: var(--surface-up); }
        .btn-mode.active { background: var(--text); color: #000; border-color: var(--text); }

        /* ─── Mode picker grid ───────────────────────────────────────────── */
        .picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        /* ─── Duration buttons (Home) ───────────────────────────────────── */
        .btn-mode.big {
            padding: 18px 8px;
            font-size: 13px;
            letter-spacing: 2px;
        }
        .custom-dur {
            margin-top: 10px;
        }
        .custom-dur select {
            width: 100%;
            padding: 14px;
            font-family: var(--mono);
            font-size: 16px;  /* iOS Safari auto-zooms inputs <16px */
            text-align: center;
            background: var(--surface);
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            -webkit-appearance: none;
            appearance: none;
        }

        /* ─── Status / error pills ──────────────────────────────────────── */
        .status {
            margin-top: 14px;
            font-size: 13px;
            color: var(--ok);
        }
        .status.warn { color: var(--warn); }

        /* ─── Locked active session view ─────────────────────────────────── */
        .locked-time {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 56px;
            text-align: center;
            margin: 12px 0;
        }
        .locked-meta {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .blocked-block {
            margin-top: 16px;
            padding-top: 14px;
            border-top: var(--hairline) solid var(--border);
        }
        .blocked-label {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
        }
        .blocked-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 10px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .blocked-list .item {
            white-space: nowrap;
        }
        .blocked-list .sep {
            color: var(--text-faint);
        }
        .locked-tip {
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            line-height: 1.6;
            margin-top: 14px;
            padding-top: 14px;
            border-top: var(--hairline) solid var(--border);
        }

        /* ─── In-session controls (check-in + emergency unflip) ────────── */
        .in-session-controls {
            margin-top: 18px;
            padding-top: 16px;
            border-top: var(--hairline) solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.12s;
        }
        .btn-secondary:hover:not(:disabled) { background: var(--surface-up); }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--warn);
            border: var(--hairline) solid var(--warn);
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.12s;
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,138,138,0.08); }
        .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }
        .check-in-active {
            width: 100%;
            padding: 14px;
            text-align: center;
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ─── Bottom tab bar (phone only — desktop keeps the sidebar) ───── */
        .tabbar {
            display: none;
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 10;
            background: rgba(0,0,0,0.92);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-top: var(--hairline) solid var(--border);
            /* Clear the iPhone home indicator. */
            padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
        }
        .tabbar .tab {
            flex: 1;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tabbar .tab .g { font-size: 13px; color: var(--text-faint); line-height: 1; }
        .tabbar .tab .t {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 1.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-top: 4px;
        }
        .tabbar .tab.active .g, .tabbar .tab.active .t { color: var(--text); }

        /* ─── Shared row/list vocabulary for the new tabs ────────────────── */
        .list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: var(--hairline) solid var(--border);
        }
        .list-row:last-child { border-bottom: none; }
        .list-row .primary { font-size: 14px; font-weight: 600; }
        .list-row .sub {
            display: block;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--text-faint);
            text-transform: uppercase;
            margin-top: 3px;
        }
        .rowbtn {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: none;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            padding: 6px 8px;
            white-space: nowrap;
        }
        .rowbtn:hover { color: var(--text); }
        .rowbtn.ok { color: var(--ok); }
        .rowbtn.danger:hover { color: var(--warn); }
        .tag-chip {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 1.5px;
            color: var(--ok);
            border: var(--hairline) solid var(--border-up);
            border-radius: 999px;
            padding: 3px 8px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .day-select { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .day-select .btn-mode { min-width: 0; padding: 8px 0; flex: 1; }
        .time-selects { display: flex; gap: 8px; margin-top: 10px; }
        .time-selects select {
            flex: 1;
            padding: 12px;
            font-family: var(--mono);
            font-size: 16px;  /* iOS Safari auto-zooms inputs <16px */
            background: var(--surface);
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            -webkit-appearance: none;
            appearance: none;
        }

        /* ─── License-key sign-in card (shown only when not signed in) ──── */
        .signin-shell {
            max-width: 440px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .signin-input {
            width: 100%;
            padding: 14px;
            font-family: var(--mono);
            font-size: 16px; /* iOS Safari auto-zooms inputs <16px — keep flush. */
            letter-spacing: 1px;
            background: var(--surface);
            color: var(--text);
            border: var(--hairline) solid var(--border-up);
            border-radius: var(--radius-sm);
            margin: 14px 0;
            box-sizing: border-box;
        }
        .signin-input:focus {
            outline: none;
            border-color: var(--text);
        }

        /* ─── Mobile (sidebar → slim top bar + bottom tab bar) ───────────── */
        @media (max-width: 720px) {
            .shell {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
                max-width: 100%;
                /* Clear the fixed bottom tab bar (+ home indicator). */
                padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px));
            }
            .sidebar {
                width: auto;
                padding: 14px 16px;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px 16px;
                /* Respect the notch when running as an installed app
                   (black-translucent status bar overlays the page). */
                margin-top: env(safe-area-inset-top, 0px);
            }
            /* Brand wordmark sits left, device status right.  Nav moves to
               the bottom tab bar; sign-out moves to the Settings tab. */
            .wordmark {
                margin-bottom: 0;
                font-size: 13px;
                letter-spacing: 3px;
            }
            .sidebar .nav-row { display: none; }
            .sidebar .signout { display: none; }
            .device-row {
                margin: 0 0 0 auto;
                padding: 0;
                border: none;
                gap: 8px;
            }
            .device-meta { font-size: 11px; }
            .tabbar { display: flex; }
            /* Cards: tighter padding, smaller hero copy */
            .card { padding: 20px 18px; }
            .h1 { font-size: 19px; }
            .display { font-size: 20px; }
            .locked-time { font-size: 44px; }
            .picker-grid {
                grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
                gap: 6px;
            }
            .btn-mode {
                min-width: 0;
                padding: 9px 8px;
                font-size: 10px;
                letter-spacing: 1.5px;
            }
            .signin-shell { margin: 24px auto; padding: 0 14px; }
        }
        /* Extra-narrow phones: collapse picker to two columns so the
           DURATION grid never crops. */
        @media (max-width: 380px) {
            .picker-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
const API = 'https://flipped-production-79b3.up.railway.app';
const LS = {
    token:    'flipped.web.token',
    device:   'flipped.web.deviceId',
    profile:  'flipped.web.activeProfile',
    tab:      'flipped.web.tab',
    duration: 'flipped.web.homeDuration',
};

// Profiles mirror BlockProfile.swift presets — keep in lockstep when the
// Mac app's preset list changes.  Custom profiles are Mac-side only for
// now; the web flip uses presets.
// Bundle-ID → friendly name lookup used by the active-session view to
// show the user exactly which apps are hidden on their iPhone.  Same
// list the Mac app uses (Flipped/Models/FriendlyAppNames.swift) — keep
// in sync when adding apps to a preset.
const APP_NAMES = {
    'com.apple.AppStore':               'App Store',
    'com.burbn.instagram':              'Instagram',
    'com.zhiliaoapp.musically':         'TikTok',
    'com.atebits.Tweetie2':             'X',
    'com.toyopagroup.picaboo':          'Snapchat',
    'com.facebook.Facebook':            'Facebook',
    'com.reddit.Reddit':                'Reddit',
    'com.pinterest':                    'Pinterest',
    'com.burbn.barcelona':              'Threads',
    'xyz.blueskyweb.app':               'Bluesky',
    'com.alphaexploration.chrono':      'BeReal',
    'com.tumblr':                       'Tumblr',
    'org.joinmastodon.app':             'Mastodon',
    'com.linkedin.LinkedIn':            'LinkedIn',
    'com.google.ios.youtube':           'YouTube',
    'com.google.ios.youtubeunplugged':  'YouTube TV',
    'com.google.ios.ytcreator':         'YouTube Studio',
    'com.netflix.Netflix':              'Netflix',
    'com.hulu.plus':                    'Hulu',
    'com.disney.disneyplus':            'Disney+',
    'com.wbd.hbomax':                   'HBO Max',
    'com.hbo.hbonow':                   'HBO Now',
    'tv.twitch':                        'Twitch',
    'com.peacocktv.peacock':            'Peacock',
    'com.amazon.aiv.AIVApp':            'Prime Video',
    'com.cbsplayer.PARAMOUNTPLUSAPP':   'Paramount+',
    'com.apple.news':                   'Apple News',
    'com.flipboard.flipboard':          'Flipboard',
    'com.robinhood.release.Robinhood':  'Robinhood',
    'com.coinbase.iphone-client':       'Coinbase',
    'com.amazon.Amazon':                'Amazon',
    'com.ebay.iphone':                  'eBay',
};

function friendlyAppName(bundleId) {
    return APP_NAMES[bundleId] || bundleId;
}

const PROFILES = {
    'preset-simple': {
        id: 'preset-simple', name: 'Simple', mode: 'social',
        tagline: 'No social or entertainment.  Discord, work, music stay.',
        bundleIds: [
            // App Store — locked into Simple (prevents reinstall workarounds).
            // Mirrors BlockProfile.swift's Simple preset + the editor's
            // lockedBundleIds(for: "preset-simple") set on the Mac.
            'com.apple.AppStore',
            'com.burbn.instagram','com.zhiliaoapp.musically','com.atebits.Tweetie2',
            'com.toyopagroup.picaboo','com.facebook.Facebook','com.reddit.Reddit',
            'com.pinterest','com.burbn.barcelona','xyz.blueskyweb.app',
            'com.alphaexploration.chrono','com.tumblr','org.joinmastodon.app',
            'com.linkedin.LinkedIn','com.google.ios.youtube',
            'com.google.ios.youtubeunplugged','com.google.ios.ytcreator',
            'com.netflix.Netflix','com.hulu.plus','com.disney.disneyplus',
            'com.wbd.hbomax','com.hbo.hbonow','tv.twitch',
            'com.peacocktv.peacock','com.amazon.aiv.AIVApp',
            'com.cbsplayer.PARAMOUNTPLUSAPP',
        ],
    },
    'preset-deep-work': {
        id: 'preset-deep-work', name: 'Deep Work', mode: 'focus',
        tagline: 'Block social, games, shopping, news, investing.',
        bundleIds: [
            'com.burbn.instagram','com.zhiliaoapp.musically','com.atebits.Tweetie2',
            'com.toyopagroup.picaboo','com.facebook.Facebook','com.reddit.Reddit',
            'com.pinterest','com.burbn.barcelona','com.apple.news',
            'com.flipboard.flipboard','com.robinhood.release.Robinhood',
            'com.coinbase.iphone-client','com.amazon.Amazon','com.ebay.iphone',
            'com.google.ios.youtube','com.netflix.Netflix',
        ],
    },
};

// Home FLIP: MANUAL (no end date, only quittable from the Mac — the old
// Home behavior) or a committed FOCUS/UNPLUG.  Four big preset buttons per
// mode + CUSTOM (native picker: hours for focus, days for unplug).
// Check-in auto-enables at 4h+, matching the Mac.
const FOCUS_PRESETS = [
    { label: '1H', seconds:      3600 },

function fmtSecLabel(sec) {
    if (sec < 3600) return `${Math.round(sec / 60)}M`;
    if (sec < 86400) return sec % 3600 === 0 ? `${sec / 3600}H` : `${Math.floor(sec / 3600)}H+`;
    return sec % 86400 === 0 ? `${sec / 86400}D` : `${Math.floor(sec / 86400)}D+`;
}
// Schedule durations are backend-capped at 7 days (10080 min).
const SCHED_DURATIONS = [

    { label: '1D',  minutes: 1440 },

const DAY_LABELS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];  // Python convention: Mon=0

    activeSession: null,

    homeMode: 'manual',        // 'manual' | 'focus' | 'unplug'
    focusSec: 4 * 3600,        // committed focus length (default 4H)

    customOpen: false,         // CUSTOM picker revealed for the active mode
    // Schedules tab

    schedError:   null,

    signInPhase:  'email',
    signInEmail:  null,
};
// The Modes tab folded into Home (2026-07-16 phone-app redesign) — remap
// any stored 'modes' tab so returning users don't land on a dead tab.
if (state.tab === 'modes' || !['home', 'schedules', 'profiles', 'settings'].includes(state.tab)) {
    state.tab = 'home';
}
// Restore the Home commitment picker (mode + per-mode durations).
try {
    const saved = JSON.parse(localStorage.getItem(LS.duration) || '{}');
    if (['manual', 'focus', 'unplug'].includes(saved.mode)) state.homeMode = saved.mode;
    if (Number.isFinite(saved.focusSec) && saved.focusSec >= 1800 && saved.focusSec <= 86400) {
        state.focusSec = saved.focusSec;
    }
    if (Number.isFinite(saved.unplugSec) && saved.unplugSec >= 86400 && saved.unplugSec <= 365 * 86400) {
        state.unplugSec = saved.unplugSec;
    }
} catch (_) { /* stale/legacy value — defaults stand */ }

function $(id) { return document.getElementById(id); }
function persist(key, value) {
    if (value == null) localStorage.removeItem(LS[key]);
    else localStorage.setItem(LS[key], value);
}

// Turn whatever FastAPI puts in `detail` into a human-readable string.
// String → as-is.  Pydantic 422 array → join each entry's "loc: msg".
// Object → prefer .msg/.message, else JSON.  Anything else → String().
function formatErrorDetail(detail) {
    if (detail == null || detail === '') return '';
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
        return detail.map(e => {
            if (typeof e === 'string') return e;
            if (e && typeof e === 'object') {
                const loc = Array.isArray(e.loc) ? e.loc.join('.') : '';
                const msg = e.msg || e.message || JSON.stringify(e);
                return loc ? `${loc}: ${msg}` : msg;
            }
            return String(e);
        }).join('; ');
    }
    if (typeof detail === 'object') {
        return detail.msg || detail.message || JSON.stringify(detail);
    }
    return String(detail);
}

async function api(path, opts = {}) {
    opts.headers = opts.headers || {};
    if (state.token) opts.headers['Authorization'] = `Bearer ${state.token}`;
    if (opts.body && typeof opts.body !== 'string') {
        opts.body = JSON.stringify(opts.body);
        opts.headers['Content-Type'] = 'application/json';
    }
    const r = await fetch(API + path, opts);
    if (!r.ok) {
        // 401/403 on any authed call means the JWT is stale (token rotated
        // after a backend deploy, account password change, etc.).  Drop it
        // and route back to the sign-in screen so the user doesn't have to
        // hunt for the "Sign out" button manually.  Pre-1.0.43 this just
        // surfaced "Invalid or expired token" under the START button while
        // the header still said "ONLINE · idle," which read as broken.
        if ((r.status === 401 || r.status === 403) && state.token) {
            state.token = null;
            state.deviceId = null;
            state.activeSession = null;
            state.signInPhase = 'email';
            state.signInEmail = null;
            state.error = 'Session expired — sign in again with your email.';
            persist('token', null);
            persist('device', null);
            render();
            throw new Error('session_expired');
        }
        let detail = '';
        try { detail = (await r.json()).detail; } catch (_) {}
        // FastAPI returns `detail` as a string for HTTPException, but as an
        // array of {loc, msg, type} objects for Pydantic validation (422).
        // `new Error([{...}])` coerces via String() to "[object Object]" —
        // which is what surfaced under FLIP for Pete 2026-05-15.  Normalise
        // to a human-readable string before throwing.
        if (detail && typeof detail !== 'string') {
            console.error('api(): non-string error detail from', path, 'status', r.status, detail);
        }
        throw new Error(formatErrorDetail(detail) || `HTTP ${r.status}`);
    }
    if (r.status === 204) return null;
    return r.json();
}

async function refreshActiveSession() {
    if (!state.token) {
        // Token's been wiped (expiry or explicit sign-out).  Pre-fix
        // this early-return left state.activeSession holding its last
        // value — so if the JWT expired while a session was active,
        // the UI showed "in session" forever even after the backend
        // had ended the session.  Pete hit this 2026-05-13.  Clear
        // any lingering session state so the next render shows the
        // sign-in screen, not a stale flipped state.
        state.activeSession = null;
        state.macActiveProfile = null;
        return;
    }
    try {
        const data = await api('/api/sessions/active');
        state.activeSession = data && data.session ? data.session : null;
        // Per-user 30-day emergency-unflip cooldown end (ISO8601 string).
        // Null means the user has never used emergency → button is eligible.
        // Stored at top level (not on session) because the cooldown crosses
        // sessions.
        state.userEmergencyEligibleAt =
            data && data.user_emergency_eligible_at
                ? data.user_emergency_eligible_at
                : null;
    } catch (e) {
        if (!String(e).includes('404')) console.warn(e);
        state.activeSession = null;
        state.userEmergencyEligibleAt = null;
    }
    // Also re-check device — covers the "I just enrolled my iPhone via Mac"
    // case where the user's already signed into the web with a stale (no-
    // device) token, plus the boot path where we restore a token from
    // localStorage but never fetched the deviceId.
    try {
        const ds = await api('/api/devices/status');
        if (ds && ds.device) {
            state.deviceId = ds.device.id;
            persist('device', state.deviceId);
        }
    } catch (e) {
        // 404 = no device on this account; leave deviceId null so the FLIP
        // button surfaces the "no iPhone enrolled" hint.
        if (!String(e).includes('404')) console.warn(e);
    }
    // Pull the Mac-synced active profile (v1.0.48 — Sam-fix).  Pre-1.0.48
    // the web fell back to PROFILES['preset-simple'] for any custom slug
    // because it had no way to know about custom profiles.  Now the Mac
    // PUTs /api/me/active-profile whenever the user picks/edits a profile,
    // and we read it here so the next flip carries the right bundles.
    // 404 = nothing synced yet (legacy user, or never picked); fine, the
    // pre-1.0.48 PROFILES fallback path still works.
    try {
        const ap = await api('/api/me/active-profile');
        if (ap && Array.isArray(ap.bundle_ids)) {
            state.macActiveProfile = ap;
        }
    } catch (e) {
        if (!String(e).includes('404')) console.warn(e);
        state.macActiveProfile = null;
    }
}

// ─── Sign-in (email + 6-digit code) ─────────────────────────────────────
// Two-phase: enter email → backend emails a code → enter code → JWT.
// Mirrors the Mac app's onboarding step 1 exactly.

async function requestEmailCode(email) {
    state.busy = true; state.error = null; render();
    try {
        const r = await fetch(API + '/api/auth/email/request-code', {
            method: 'POST',
            // The X-Client header that briefly lived here was rejected by
            // the backend's CORS allow-list (Disallowed CORS headers →
            // preflight 400 → Safari throws "Load failed").  Removed
            // 2026-05-13.  When/if we re-introduce it, also add to the
            // backend's CORSMiddleware allow_headers list.
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email.trim().toLowerCase()}),
        });
        // 204 = code sent.  429 = rate-limited (per-email + per-IP).  404 =
        // either the email isn't on file OR the backend route is temporarily
        // unavailable — surface a friendlier message that points users to
        // the Mac onboarding so they don't sit waiting for an email that
        // never arrives.  Pete reported the silent-failure UX 2026-05-13.
        if (r.status === 429) throw new Error('Too many attempts — wait a minute and try again.');
        if (r.status === 404) throw new Error("We don't have an account for that email yet — sign up from the Mac app first, then come back here to flip from the web.");
        if (!r.ok && r.status !== 204) throw new Error(`HTTP ${r.status}`);
        // Success: advance to the code-entry phase.
        state.signInEmail = email.trim().toLowerCase();
        state.signInPhase = 'code';
    } catch (e) {
        state.error = e.message || 'Network error.';
    } finally {
        state.busy = false; render();
    }
}

async function verifyEmailCode(code) {
    state.busy = true; state.error = null; render();
    try {
        const r = await fetch(API + '/api/auth/email/verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: state.signInEmail,
                code:  code.trim(),
            }),
        });
        if (!r.ok) {
            const detail = (await r.json().catch(() => ({}))).detail
                || (r.status === 400 ? 'Invalid or expired code.'
                  : r.status === 429 ? 'Too many attempts — try again later.'
                  : `HTTP ${r.status}`);
            throw new Error(detail);
        }
        const body = await r.json();
        state.token = body.access_token;
        persist('token', state.token);
        // Try device-status; ok if no device yet.
        const ds = await api('/api/devices/status').catch(() => null);
        if (ds && ds.device) {
            state.deviceId = ds.device.id;
            persist('device', state.deviceId);
        }
        await refreshActiveSession();
        // Reset sign-in state for next time.
        state.signInPhase = 'email'; state.signInEmail = null;
    } catch (e) {
        state.error = e.message || String(e) || 'Something went wrong.';
    } finally {
        state.busy = false; render();
    }
}

function backToEmailEntry() {
    state.signInPhase = 'email';
    state.error = null;
    state.signInEmail = null;
    render();
}

function signOut() {
    if (!confirm('Sign out of this device?  You\'ll need a fresh sign-in code to return.')) return;
    state.token = null; state.deviceId = null; state.activeSession = null;
    state.signInPhase = 'email'; state.signInEmail = null;
    persist('token', null); persist('device', null);
    render();
}

// ─── Session control ────────────────────────────────────────────────────
// Manual flip from Home: no duration, only quittable from the Mac app.
// Mirrors the Mac app's HomeView FLIP button.
async function startManualFlip(profileId) {
    if (!state.deviceId) {
        state.error = 'No iPhone on this account.  Make sure you signed in with the same email the Mac app uses.';
        render(); return;
    }
    state.busy = true; state.error = null; render();
    try {
        // v1.0.48 — prefer the Mac-synced active profile (lets web see
        // custom profiles).  Fall back to the hardcoded PROFILES dict so
        // legacy users without an active-profile sync still flip cleanly,
        // and finally to preset-simple if neither knows about the slug.
        const profile = resolveFlipProfile(profileId);
        await api('/api/sessions/start', {
            method: 'POST',
            body: {
                device_id: state.deviceId,
                mode: profile.mode,
                // No duration_seconds → manual session.  Only the Mac app
                // can end it (no commitment lock, no web escape needed).
                blocked_bundle_ids: profile.bundleIds,
            },
        });
        await refreshActiveSession();
    } catch (e) {
        state.error = e.message || String(e) || 'Something went wrong.';
    } finally {
        state.busy = false; render();
    }
}

// Resolve a flip request to a {mode, bundleIds} pair.  Priority:
//   1. Mac-synced active profile (covers custom profiles created on Mac)
//   2. Hardcoded PROFILES dict (covers presets when nothing's synced)
//   3. preset-simple fallback (legacy behavior; web never shows nothing)
// Pre-1.0.48 we only had #2 → #3, which is why Sam's custom profile
// silently got replaced with Simple when he flipped from web.
function resolveFlipProfile(profileId) {
    const synced = state.macActiveProfile;
    if (synced && Array.isArray(synced.bundle_ids)
        && (synced.slug === profileId || !PROFILES[profileId])) {
        return {
            mode:      synced.mode || 'focus',
            bundleIds: synced.bundle_ids,
        };
    }
    return PROFILES[profileId] || PROFILES['preset-simple'];
}

// Committed flip from Modes tab: fixed duration.  4hr+ sessions auto-
// enable the 15-min check-in window (Shift parity).  Web now supports
// emergency unflip + check-in directly — no Mac trip required.
async function startCommittedFlip(mode, durationSec) {
    if (!state.deviceId) {
        state.error = 'No iPhone on this account.  Make sure you signed in with the same email the Mac app uses.';
        render(); return;
    }
    state.busy = true; state.error = null; render();
    try {
        // Modes use the active profile's bundle list — same contract as
        // Mac ModesView (profile = WHAT, mode = HOW LONG).  Same Mac-sync
        // preference as startManualFlip — see resolveFlipProfile above.
        const profile = resolveFlipProfile(state.profileId);
        // 14400s = 4hr — match the Mac's threshold for offering check-in.
        // Backend ignores the flag for forever-mode sessions, so the
        // condition is purely informational here.
        const checkInEnabled = durationSec >= 14400;
        await api('/api/sessions/start', {
            method: 'POST',
            body: {
                device_id: state.deviceId,
                mode: mode,                  // 'focus' or 'unplug'
                duration_seconds: durationSec,
                blocked_bundle_ids: profile.bundleIds,
                check_in_enabled: checkInEnabled,
            },
        });
        await refreshActiveSession();
    } catch (e) {
        state.error = e.message || String(e) || 'Something went wrong.';
    } finally {
        state.busy = false; render();
    }
}

// One FLIP button, two paths: MANUAL starts an open-ended session (Mac
// ends it); FOCUS/UNPLUG commit to the picked duration.
function selectedHomeDuration() {
    if (state.homeMode === 'focus')  return state.focusSec;
    if (state.homeMode === 'unplug') return state.unplugSec;
    return null;
}
function flipNow() {
    if (state.homeMode === 'manual') return startManualFlip(state.profileId);
    return startCommittedFlip(state.homeMode, selectedHomeDuration());
}
function persistHomePicker() {
    persist('duration', JSON.stringify({
        mode: state.homeMode, focusSec: state.focusSec, unplugSec: state.unplugSec,
    }));
}
function setHomeMode(m) {
    state.homeMode = m;
    state.customOpen = false;
    persistHomePicker();
    render();
}
function setHomeSec(sec) {
    if (state.homeMode === 'focus') state.focusSec = sec;
    else state.unplugSec = sec;
    state.customOpen = false;
    persistHomePicker();
    render();
}
function openCustomDuration() { state.customOpen = true; render(); }
function onCustomDuration(value) {
    const sec = Number(value);
    if (!Number.isFinite(sec) || sec <= 0) return;
    if (state.homeMode === 'focus') state.focusSec = sec;
    else state.unplugSec = sec;
    persistHomePicker();
    render();
}

// ─── Schedules (CRUD against /api/schedules) ────────────────────────────
// The backend stores fire time in UTC (hour/minute + weekday set, Mon=0).
// We convert at the edge, both directions, INCLUDING the weekday shift
// when the local↔UTC conversion crosses midnight (9 PM PDT Mon = 4 AM UTC
// Tue).  Known limit shared with the Mac: the stored UTC time is fixed, so
// the local fire time drifts an hour across DST changes.

// JS getDay()/getUTCDay() are Sun=0; the backend is Mon=0.
function jsDayToPy(jsDay) { return (jsDay + 6) % 7; }

// For a chosen local weekday (Mon=0) + local h:m, find the UTC weekday +
// h:m by materialising a concrete date this week and reading its UTC parts.
function localScheduleToUtc(pyDayLocal, hourLocal, minuteLocal) {
    const now = new Date();
    const todayPy = jsDayToPy(now.getDay());
    const d = new Date(now);
    d.setDate(now.getDate() + ((pyDayLocal - todayPy + 7) % 7));
    d.setHours(hourLocal, minuteLocal, 0, 0);
    return {
        day:    jsDayToPy(d.getUTCDay()),
        hour:   d.getUTCHours(),
        minute: d.getUTCMinutes(),
    };
}

// Reverse: stored UTC weekday + h:m → local weekday + h:m for display.
function utcScheduleToLocal(pyDayUtc, hourUtc, minuteUtc) {
    const now = new Date();
    const todayPyUtc = jsDayToPy(now.getUTCDay());
    const d = new Date(now);
    d.setUTCDate(now.getUTCDate() + ((pyDayUtc - todayPyUtc + 7) % 7));
    d.setUTCHours(hourUtc, minuteUtc, 0, 0);
    return {
        day:    jsDayToPy(d.getDay()),
        hour:   d.getHours(),
        minute: d.getMinutes(),
    };
}

function fmtLocalTime(hour, minute) {
    return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
}

// Human summary of a schedule row, in the USER'S timezone.
function describeSchedule(s) {
    if (!s.recurring || !Array.isArray(s.days_of_week) || s.days_of_week.length === 0) {
        const t = utcScheduleToLocal(0, s.fire_hour_utc, s.fire_minute_utc);
        return `${s.fire_date || 'ONE-OFF'} · ${fmtLocalTime(t.hour, t.minute)} · ${fmtDurationMin(s.duration_minutes)}`;
    }
    const locals = s.days_of_week.map(d => utcScheduleToLocal(d, s.fire_hour_utc, s.fire_minute_utc));
    const days = locals.map(l => l.day).sort((a, b) => a - b);
    const dayStr = days.length === 7 ? 'EVERY DAY'
        : (days.join(',') === '0,1,2,3,4' ? 'WEEKDAYS'
        : (days.join(',') === '5,6' ? 'WEEKENDS'
        : days.map(d => DAY_LABELS[d]).join(' ')));
    return `${dayStr} · ${fmtLocalTime(locals[0].hour, locals[0].minute)} · ${fmtDurationMin(s.duration_minutes)}`;
}

function fmtDurationMin(min) {
    if (min < 60) return `${min}M`;
    if (min < 1440) return min % 60 === 0 ? `${min / 60}H` : `${Math.floor(min / 60)}H${min % 60}M`;
    return min % 1440 === 0 ? `${min / 1440}D` : `${Math.floor(min / 1440)}D+`;
}

async function loadSchedules() {
    try {
        state.schedules = await api('/api/schedules');
        state.schedError = null;
    } catch (e) {
        state.schedError = e.message || 'Couldn\'t load schedules.';
    }
    render();
}

function openScheduleForm() {
    state.schedForm = {
        name: '',
        days: [0, 1, 2, 3, 4],          // local weekdays, Mon=0 — weekdays default
        hour: 21, minute: 0,            // local
        durationMin: 480,
    };
    render();
}
function closeScheduleForm() { state.schedForm = null; render(); }
function schedToggleDay(d) {
    const f = state.schedForm; if (!f) return;
    f.days = f.days.includes(d) ? f.days.filter(x => x !== d) : [...f.days, d].sort();
    render();
}
function schedSetDuration(min) { if (state.schedForm) { state.schedForm.durationMin = min; render(); } }
function schedSetTime() {
    const f = state.schedForm; if (!f) return;
    const h = document.getElementById('sched-hour');
    const m = document.getElementById('sched-min');
    if (h) f.hour = Number(h.value);
    if (m) f.minute = Number(m.value);
}

async function saveSchedule() {
    const f = state.schedForm;
    if (!f) return;
    schedSetTime();
    const nameEl = document.getElementById('sched-name');
    if (nameEl) f.name = nameEl.value;
    if (f.days.length === 0) { state.schedError = 'Pick at least one day.'; render(); return; }
    if (!state.deviceId) { state.schedError = 'No iPhone on this account yet.'; render(); return; }
    state.busy = true; state.schedError = null; render();
    try {
        // Each selected local day converts independently — the UTC weekday
        // can differ per day, but hour/minute are the same for all of them.
        const utcDays = f.days.map(d => localScheduleToUtc(d, f.hour, f.minute));
        await api('/api/schedules', {
            method: 'POST',
            body: {
                device_id: state.deviceId,
                mode: f.durationMin * 60 >= 86400 ? 'unplug' : 'focus',
                recurring: true,
                days_of_week: [...new Set(utcDays.map(u => u.day))].sort(),
                fire_hour_utc: utcDays[0].hour,
                fire_minute_utc: utcDays[0].minute,
                duration_minutes: f.durationMin,
                name: (f.name || '').trim() || null,
            },
        });
        state.schedForm = null;
        await loadSchedules();
    } catch (e) {
        state.schedError = e.message || 'Couldn\'t save the schedule.';
    } finally {
        state.busy = false; render();
    }
}

async function toggleSchedule(id, enable) {
    state.busy = true; render();
    try {
        await api(`/api/schedules/${id}`, { method: 'PATCH', body: { enabled: enable } });
        await loadSchedules();
    } catch (e) {
        state.schedError = e.message || 'Couldn\'t update the schedule.';
    } finally {
        state.busy = false; render();
    }
}

async function deleteSchedule(id) {
    if (!confirm('Delete this schedule?')) return;
    state.busy = true; render();
    try {
        await api(`/api/schedules/${id}`, { method: 'DELETE' });
        await loadSchedules();
    } catch (e) {
        state.schedError = e.message || 'Couldn\'t delete the schedule.';
    } finally {
        state.busy = false; render();
    }
}

// ─── Settings data (account · billing · stats) ──────────────────────────
async function loadSettingsData() {
    const [me, billing, stats] = await Promise.all([
        api('/api/me').catch(() => null),
        api('/api/billing/status').catch(() => null),
        api('/api/me/stats').catch(() => null),
    ]);
    state.me = me; state.billing = billing; state.stats = stats;
    render();
}

// Detect "already installed" so the ADD TO HOME SCREEN hint disappears
// once the user is running the real app.
function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
}

function fmtHours(totalSeconds) {
    const h = Math.floor((totalSeconds || 0) / 3600);
    return h >= 1000 ? `${Math.round(h / 100) / 10}K` : String(h);
}

// ─── In-session controls (web parity with Mac) ──────────────────────────
// Both buttons hit the same endpoints as the Mac app.  Server enforces the
// once-per-session + 30-day-per-user limits; we hide the buttons after use
// to keep the UI honest, but the server is the ultimate gate.

async function emergencyUnflipWeb() {
    if (!confirm('Use your 1×/month emergency unflip?  This ends the session immediately and locks the button for 30 days across all your devices.')) return;
    state.busy = true; state.error = null; render();
    try {
        await api('/api/sessions/active/emergency-end', { method: 'POST' });
        await refreshActiveSession();
    } catch (e) {
        // 400 = wrong mode, 409 = already used this session, 429 = cooldown.
        // Surface backend's detail string directly — it's already user-friendly.
        state.error = e.message || String(e) || 'Emergency unflip failed.';
    } finally {
        state.busy = false; render();
    }
}

async function startCheckInWeb() {
    state.busy = true; state.error = null; render();
    try {
        await api('/api/sessions/active/check-in', { method: 'POST' });
        await refreshActiveSession();
    } catch (e) {
        // 409 = window already open, 429 = already used this session.
        state.error = e.message || String(e) || 'Check-in failed.';
    } finally {
        state.busy = false; render();
    }
}

// ─── Helpers ────────────────────────────────────────────────────────────
function fmtRemaining(session) {
    if (!session.endDate && !session.expires_at) return 'IN SESSION';
    const end = new Date(session.expires_at || session.endDate);
    const ms = end - new Date();
    if (ms <= 0) return '0m';
    const m = Math.floor(ms / 60000);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
}

function setTab(t) {
    state.tab = t; persist('tab', t);
    // Lazy-load per-tab data on first visit; refresh settings each visit
    // (subscription state can change out from under a long-lived app).
    if (t === 'schedules' && state.schedules === null && state.token) loadSchedules();
    if (t === 'settings' && state.token) loadSettingsData();
    render();
}
function setProfile(id) { state.profileId = id; persist('profile', id); render(); }
function toggleProfileExpand(id) {
    state.expandedProfile = state.expandedProfile === id ? null : id;
    render();
}

// ─── Render ─────────────────────────────────────────────────────────────
function render() {
    const root = $('root');
    if (!state.token) { root.innerHTML = renderSignIn(); return; }
    root.innerHTML = renderApp();
}

// Inline-onclick helpers — readInput at click-time so they work regardless
// of when the listener was attached (innerHTML strips <script> tags).
function submitEmailRequest() {
    const el = document.getElementById('email-input');
    if (!el) return;
    requestEmailCode(el.value);
}
function submitCodeVerify() {
    const el = document.getElementById('code-input');
    if (!el) return;
    verifyEmailCode(el.value);
}

function renderSignIn() {
    if (state.signInPhase === 'code') return renderCodeEntry();
    return renderEmailEntry();
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

const TABS = [

    { id: 'profiles',  label: 'Profiles',  glyph: '▤' },
    { id: 'settings',  label: 'Settings',  glyph: '◯' },
];

function renderApp() {
    const session = state.activeSession;
    // The active session lives on the Home tab; the other tabs stay
    // reachable mid-flip (schedule tomorrow while today is locked).
    const main =
        state.tab === 'schedules' ? renderSchedules()
      : state.tab === 'profiles'  ? renderProfiles()
      : state.tab === 'settings'  ? renderSettings()
      : (session ? renderActiveSession(session)

    const sec = selectedHomeDuration();

    const customActive = state.customOpen || !isPreset;
    const checkInIncluded = sec != null && sec >= 14400;
    const microCopy = mode === 'manual'

            <select onchange="onCustomDuration(this.value)">
                ${customOptions.map(o => `

                `).join('')}

function renderActiveSession(session) {
    const hasTimer = !!(session.expires_at || session.endDate);

    // Surface the list of apps currently hidden on the phone.  Prefer
    // the server-provided blocked_bundle_ids (accurate regardless of
    // which client started the session); fall back to the website's
    // remembered profile when older sessions don't yet have the field.
    const serverBundles = Array.isArray(session.blocked_bundle_ids)
        ? session.blocked_bundle_ids
        : null;
    const profileBundles =
        (PROFILES[state.profileId] && PROFILES[state.profileId].bundleIds) || [];
    const sourceBundles = (serverBundles && serverBundles.length > 0)
        ? serverBundles
        : profileBundles;
    const blockedItems = sourceBundles
        .map(friendlyAppName)
        .filter(Boolean);
    const blockedHTML = blockedItems.length === 0 ? '' : `
        <div class="blocked-block">
            <div class="blocked-label">— Hidden right now (${blockedItems.length}) —</div>
            <div class="blocked-list">
                ${blockedItems.map((name, i) => `
                    <span class="item">${name}</span>${
                        i < blockedItems.length - 1 ? '<span class="sep">·</span>' : ''
                    }
                `).join('')}
            </div>
        </div>`;

    // ── In-session controls (parity with Mac HomeView) ──────────────────
    // 15-min check-in: visible only when (a) check-in was enabled at session
    // start (4hr+ sessions get it automatically), (b) the user hasn't taken
    // one in this session, and (c) no check-in window is currently open
    // (server returns check_in_active_until while open — show the live
    // countdown then).
    const now = new Date();
    const checkInActiveUntil = session.check_in_active_until
        ? new Date(session.check_in_active_until)
        : null;
    const checkInWindowOpen = checkInActiveUntil && checkInActiveUntil > now;
    const checkInUsed = !!session.last_check_in_at;
    // HONEST flip state: claim "FLIPPED" ONLY when the block is actually installed
    // on the phone right now.  profile_installed_at is the backend's Ack-stamped
    // "block is live" signal (now cleared whenever apps are made visible).  Null
    // => the install (or the re-block after a check-in) is still in flight — never
    // say FLIPPED (Cal 2026-06-18: panel said FLIPPED while the apps were open).
    const blockApplied = !!session.profile_installed_at;
    const showCheckInButton = !!session.check_in_enabled && !checkInUsed && !checkInWindowOpen;
    const checkInBlock = checkInWindowOpen
        ? `<div class="check-in-active">
              CHECK-IN ACTIVE · ${Math.max(0, Math.round((checkInActiveUntil - now) / 60000))} MIN REMAINING
              <div class="muted" style="font-size:11px; margin-top:4px;">Phone re-locks when this hits zero.</div>
           </div>`
        : (showCheckInButton
            ? `<button class="btn-secondary" ${state.busy ? 'disabled' : ''}
                       onclick="startCheckInWeb()">
                   ▶ START 15-MIN CHECK-IN
               </button>`
            : '');

    // Emergency unflip: the web's universal escape hatch.  Visible on any
    // active session ≤ 1 week (including manual no-timer flips, since web
    // users away from their Mac have no other way to end).  Hidden when
    // (a) already used this session, (b) per-user 30-day cooldown active,
    // (c) duration > 1 week (multi-week Unplug — server requires support
    // contact), or (d) mode is the retired forever (defensive).
    const userEligibleAt = state.userEmergencyEligibleAt
        ? new Date(state.userEmergencyEligibleAt)
        : null;
    const cooldownActive = userEligibleAt && userEligibleAt > now;
    const emergencyUsed = !!session.emergency_end_used;
    const durationSec = Number(session.duration_seconds) || 0;
    const sessionTooLongForEmergency = durationSec > 604800;  // 7 days
    const isForeverMode = (session.mode || '').toLowerCase() === 'forever';
    const showEmergencyButton =
        !emergencyUsed
        && !cooldownActive
        && !sessionTooLongForEmergency
        && !isForeverMode;
    const emergencyBlock = showEmergencyButton
        ? `<button class="btn-danger" ${state.busy ? 'disabled' : ''}
                   onclick="emergencyUnflipWeb()">
               EMERGENCY UNFLIP — 1/MONTH
           </button>`
        : '';

    // Tip copy adapts based on what the user can/can't do from web.
    let tipBody;
    if (!hasTimer) {
        tipBody = `Open Flipped on your Mac and tap
                   <strong style="color: var(--text)">UNFLIP</strong>
                   whenever you're ready.  Manual sessions don't expire on their
                   own — that's the point.`;
    } else if (showEmergencyButton || showCheckInButton || checkInWindowOpen) {
        tipBody = `Otherwise the timer runs out on its own and your apps return.`;
    } else {
        tipBody = `Wait for the timer to end — your apps return automatically.`;
    }

    const controlsHTML = (checkInBlock || emergencyBlock)
        ? `<div class="in-session-controls">
               ${checkInBlock}
               ${emergencyBlock}
           </div>`
        : '';

    // Header reflects the REAL phone state, not just "is there a session".
    const headerMeta = blockApplied
        ? `PHONE IS FLIPPED · MODE: ${(session.mode || '').toUpperCase()}`
        : (checkInWindowOpen
            ? `CHECK-IN ACTIVE · APPS ARE BACK`
            : `◐ APPLYING — UNLOCK YOUR IPHONE`);
    const headerStyle = blockApplied ? '' : ' style="color:#e0a83a"';
    // Only say apps are "hidden" when the block is actually installed.  While it's
    // applying (or a re-block is catching up), tell the truth instead of lying.
    const blockStateHTML = blockApplied
        ? blockedHTML
        : (checkInWindowOpen
            ? ''
            : `<div class="locked-applying" style="margin-top:14px; font-size:13px; line-height:1.55; color:var(--muted,#9aa6b2);">
                   Your apps aren't hidden yet.  Unlock your iPhone and keep it on for a few seconds so the block can finish applying — this switches to <strong style="color:var(--text,#fff)">PHONE IS FLIPPED</strong> the instant it lands.
               </div>`);

    return `
    <h1 class="h1">In session</h1>
    <p class="h-meta">${hasTimer
        ? 'Timer running.  You can take your check-in or use your monthly emergency unflip below.'
        : 'Manual session.  Only your Mac can end this.'}</p>
    <div class="card">
        <div class="locked-meta"${headerStyle}>${headerMeta}</div>
        <div class="locked-time">${hasTimer ? fmtRemaining(session) : '∞'}</div>
        <div class="locked-meta">${hasTimer ? 'REMAINING' : 'MANUAL · NO TIMER'}</div>
        ${blockStateHTML}
        ${controlsHTML}
        <div class="locked-tip">${tipBody}</div>
    </div>
    `;
}

// ─── Boot + periodic refresh ────────────────────────────────────────────
(async function () {
    if (state.token) {
        try { await refreshActiveSession(); }
        catch (_) {
            // Token expired — drop it, force re-redeem
            state.token = null; persist('token', null);
        }
    }
    render();
    // The app can reopen on a persisted tab — hydrate that tab's data the
    // same way setTab() would have.
    if (state.token && state.tab === 'schedules') loadSchedules();
    if (state.token && state.tab === 'settings') loadSettingsData();
    // Refresh active session every 5s, matching the Mac app's poll cadence.
    // Keeps the web view in sync with sessions started or ended on the Mac
    // (or vice versa) within the same window users perceive as "instant."
    // Skip the re-render while the user is mid-form (schedule editor, or
    // any focused input) — innerHTML replacement would eat their typing.
    setInterval(() => {
        if (!state.token) return;
        refreshActiveSession().then(() => {
            const el = document.activeElement;
            const typing = el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
            if (!state.schedForm && !typing) render();
        });
    }, 5000);
})();
</script>
