<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLIPPED — flip your phone. get your life back.</title>
    <meta name="description" content="A screen-time blocker for iPhone with zero workarounds. Currently in open beta — free for testers." />
    <link rel="stylesheet" href="styles.css?v=16" />
    <style>
        /* ── Beta homepage — minimal centered (Variant E) ───────────────────
           Everything centered. No signup form. One CTA → download. Footer.
           Designed for beta testers; nothing fake (no testimonials, no
           pricing, no press logos) until we earn them.
        ─────────────────────────────────────────────────────────────────── */
        :root {
            --mono: "SF Mono", Menlo, monospace;
            --silver-1: #ffffff;
            --silver-2: #d8d8d8;
            --silver-3: #888888;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topnav-min {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .topnav-min .brand {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
            background: linear-gradient(to bottom, var(--silver-1), var(--silver-2), var(--silver-3), var(--silver-2), var(--silver-1));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        main.hero-min {
            flex: 1 0 auto;
            text-align: center;
            padding: 80px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .beta-pill {
            display: inline-block;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2.5px;
            color: #999;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 5px 12px;
            margin-bottom: 28px;
        }

        .headline-min {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1.2px;
            margin: 0 0 16px;
            text-align: center;
        }

        .lede-min {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
            max-width: 360px;
            margin: 0 auto 28px;
            text-align: center;
        }

        .btn-download {
            background: #fff;
            color: #000;
            border: none;
            padding: 14px 26px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        .btn-download:hover { opacity: 0.92; }
        .btn-download .arrow { margin-right: 6px; }

        .micro-min {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #666;
            margin-top: 14px;
        }

        .how-band {
            padding: 44px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        .how-three {
            max-width: 380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .how-line {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 1px;
            color: #fff;
            text-align: center;
        }
        .how-line .step {
            color: #666;
            margin-right: 10px;
        }

        .footer-min {
            padding: 28px 20px 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: #666;
            text-align: center;
        }
        .footer-min a {
            color: #888;
            text-decoration: none;
        }
        .footer-min a:hover { color: #fff; }

        /* Mobile tweaks */
        @media (max-width: 540px) {
            main.hero-min { padding: 56px 18px 44px; }
            .headline-min { font-size: 34px; }
            .lede-min { font-size: 13px; }
        }
    </style>
</head>
<body>

<!-- ── Centered brand nav ─────────────────────────────────────────── -->
<nav class="topnav-min">
    <div class="brand">FLIPPED</div>
</nav>

<!-- ── Hero — centered, single CTA ───────────────────────────────── -->
<main class="hero-min">

    <div class="beta-pill">OPEN BETA · FREE</div>

    <h1 class="headline-min">
        Flip your phone.<br>
        Get your life back.
    </h1>

    <p class="lede-min">
        A screen-time blocker for iPhone with zero workarounds.
    </p>

    <!-- Routes through Railway /api/download so we record every click as a
         user_event + push a real-time ntfy to Pete.  Backend 302-redirects
         to /downloads/Flipped-latest.dmg on GitHub Pages.  Cross-origin so
         we drop the `download` attr — Safari/Chrome download anyway because
         GitHub Pages serves the .dmg with Content-Type:application/octet-stream. -->
    <a href="https://flipped-production-79b3.up.railway.app/api/download" class="btn-download">
        <span class="arrow">▼</span>DOWNLOAD FOR MAC
    </a>

    <div class="micro-min">macOS 13+ · iPhone iOS 17+</div>

</main>

<!-- ── How it works — 3 single lines, centered ──────────────────── -->
<section class="how-band">
    <div class="how-three">
        <div class="how-line"><span class="step">01</span>Plug your iPhone into your Mac</div>
        <div class="how-line"><span class="step">02</span>Pick a profile, set a timer</div>
        <div class="how-line"><span class="step">03</span>Tap FLIP · apps disappear</div>
    </div>
</section>

<!-- ── Footer ───────────────────────────────────────────────────── -->
<footer class="footer-min">
    © 2026 FLIPPED ·
    <a href="privacy.html">PRIVACY</a> ·
    <a href="terms.html">TERMS</a> ·
    <a href="mailto:support@useflipped.com">SUPPORT</a>
</footer>

</body>
</html>
